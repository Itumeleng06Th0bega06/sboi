---
# ===========================================================================
# cPanel Git™ Version Control — deployment recipe
# ===========================================================================
#
# Account: shekinah  ->  repo & app root  ~/repositories/sboi
#                        virtualenv       ~/virtualenv/repositories/sboi/<py>/
#                        web root         ~/public_html
#
# cPanel -> Git Version Control -> (your repo) -> "Pull or Deploy" ->
# "Deploy HEAD Commit" runs the tasks below inside the repo directory.
#
# APP_NAME is the repo folder (repositories/<APP_NAME>); VENV_NAME is the
# "Setup Python App" name (normally the same). The Python version is
# auto-detected, so you do not need to know it.
# ===========================================================================

deployment:
  tasks:
    # --- Repo folder name (cPanel clones into ~/repositories/<name>) --------
    - export APP_NAME=sboi
    # --- Name used in "Setup Python App" (its virtualenv folder) ------------
    - export VENV_NAME=sboi
    # -----------------------------------------------------------------------
    - export APP_ROOT=$HOME/repositories/$APP_NAME
    - export DJANGO_SETTINGS_MODULE=sboi.settings_prod

    # Locate the virtualenv cPanel created. cPanel nests it under the Python
    # app's root (e.g. ~/virtualenv/repositories/sboi/3.13/bin/python), so
    # search for it instead of assuming a single layout / Python version.
    - export VENV_PY=$(find $HOME/virtualenv -maxdepth 6 -path "*/${VENV_NAME}/*/bin/python" 2>/dev/null | head -n1)
    - export VENV_BIN=${VENV_PY%/python}
    - test -n "$VENV_PY" || (echo "ERROR - no virtualenv found for '$VENV_NAME' under $HOME/virtualenv; set VENV_NAME in .cpanel.yml" && exit 1)

    - echo "==> Using interpreter $VENV_PY"

    - echo "==> Installing Python dependencies"
    - $VENV_BIN/pip install --upgrade pip
    - $VENV_BIN/pip install -r $APP_ROOT/requirements.txt

    - echo "==> Applying database migrations"
    - $VENV_BIN/python $APP_ROOT/manage.py migrate --noinput --settings=sboi.settings_prod

    - echo "==> Collecting static files into the project (staticfiles/)"
    - $VENV_BIN/python $APP_ROOT/manage.py collectstatic --noinput --settings=sboi.settings_prod

    - echo "==> Installing web-server rules in public_html"
    # Static files live in the project now, so drop the old public_html/static
    # copy: otherwise Apache would keep serving stale files. collectstatic
    # regenerates everything into $APP_ROOT/staticfiles.
    - rm -rf $HOME/public_html/static
    - mkdir -p $HOME/public_html/media
    - touch $HOME/public_html/.htaccess
    - grep -q SBOI-DEPLOY-MARKER $HOME/public_html/.htaccess || cat $APP_ROOT/.htaccess >> $HOME/public_html/.htaccess
    - printf 'PassengerEnabled off\n' > $HOME/public_html/media/.htaccess

    - echo "==> Restarting the Passenger application"
    - mkdir -p $APP_ROOT/tmp
    - touch $APP_ROOT/tmp/restart.txt

    - echo "==> Deployment finished"
