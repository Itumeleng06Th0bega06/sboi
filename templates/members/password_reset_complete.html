{% extends 'base.html' %}

{% block title %}Password updated · {{ site_profile.church_name }}{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container auth-wrap">
        <div class="auth-card">
            <h1 class="auth-title">Password updated</h1>
            <p class="auth-sub">Your password has been set. You can now sign in with your new password.</p>
            <p class="auth-foot"><a href="{% url 'members:login' %}">Login to your account</a></p>
        </div>
    </div>
</section>
{% endblock %}
