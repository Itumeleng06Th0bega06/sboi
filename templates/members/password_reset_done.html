{% extends 'base.html' %}

{% block title %}Check your email · {{ site_profile.church_name }}{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container auth-wrap">
        <div class="auth-card">
            <h1 class="auth-title">Check your email</h1>
            <p class="auth-sub">If an account exists for that address, we have sent a password reset link. Follow it to choose a new password.</p>
            <p class="auth-foot"><a href="{% url 'members:login' %}">Back to login</a></p>
        </div>
    </div>
</section>
{% endblock %}
