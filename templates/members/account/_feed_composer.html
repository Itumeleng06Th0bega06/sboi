{% load i18n %}
{# Shared post composer for the member community and the admin iChat surface. #}
<form method="post"
      action="{% url 'members:feed_post_create' %}"
      enctype="multipart/form-data"
      class="cf-composer"
      data-feed-composer
      data-cf-composer
      data-surface="{{ feed_surface|default:'community' }}">
    {% csrf_token %}
    <input type="hidden" name="surface" value="{{ feed_surface|default:'community' }}">
    <div class="cf-composer-row">
        {% if member_avatar_url %}
        <img src="{{ member_avatar_url }}" alt="" class="cf-avatar cf-avatar--sm cf-avatar-img cf-composer-avatar">
        {% else %}
        <span class="cf-avatar cf-avatar--sm cf-composer-avatar" aria-hidden="true">{{ member_initials|default:'S' }}</span>
        {% endif %}
        <label class="cf-composer-field">
            <span class="sr-only">Share a post with the community</span>
            <textarea name="body" rows="1" maxlength="8000" data-feed-textarea></textarea>
        </label>
        <button type="button" class="cf-composer-attach" data-cf-attach aria-label="Attach a file" title="Attach a file">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="submit" class="cf-composer-send" aria-label="Post to the community" title="Post">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 12 16-8-5 16-3-7-8-1Z"/></svg>
        </button>
    </div>
    <input type="file" name="attachment" class="cf-composer-file" data-feed-file
           accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.rtf,.odt,.ods,.jpg,.jpeg,.png,.gif,.webp,.mp4,.webm,.mov,.m4v"
           aria-label="Attach a file">
    <div class="cf-composer-preview" data-cf-composer-preview hidden>
        <span class="cf-composer-preview-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        </span>
        <span data-feed-file-name></span>
        <button type="button" class="cf-composer-preview-clear" data-cf-attach-clear aria-label="Remove attachment">&times;</button>
    </div>
    <p class="cf-composer-hint">Visible to all signed-in members · Enter to post, Shift + Enter for a new line</p>
    <p class="cf-field-error" data-feed-error data-cf-composer-error hidden></p>
    <p class="cf-composer-status" data-cf-composer-status role="status" aria-live="polite"></p>
</form>
