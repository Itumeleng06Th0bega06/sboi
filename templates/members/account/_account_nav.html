<nav class="account-nav" aria-label="Account sections">
    <div class="account-nav-group">
        <p class="account-nav-group-title">Overview</p>
        <a href="{% url 'members:account' %}" class="account-nav-link{% if account_section == 'account' %} active{% endif %}">
            <span class="account-nav-label">My profile</span>
            <span class="account-nav-hint">Dashboard</span>
        </a>
    </div>
    <div class="account-nav-group">
        <p class="account-nav-group-title">Family &amp; Ministry</p>
        <a href="{% url 'members:account_children' %}" class="account-nav-link{% if account_section == 'children' %} active{% endif %}">
            <span class="account-nav-label">Children</span>
            <span class="account-nav-hint">Family</span>
        </a>
        <a href="{% url 'members:account_activities' %}" class="account-nav-link{% if account_section == 'activities' %} active{% endif %}">
            <span class="account-nav-label">Activities</span>
            <span class="account-nav-hint">Ministries</span>
        </a>
    </div>
    <div class="account-nav-group">
        <p class="account-nav-group-title">Communication</p>
        <a href="{% url 'members:account_messages' %}" class="account-nav-link{% if account_section == 'messages' %} active{% endif %}">
            <span class="account-nav-label">Messages</span>
            <span class="account-nav-hint">
                Private inbox
                <span class="account-nav-badge" data-account-count="messages"{% if not unread_messages %} hidden{% endif %}>{{ unread_messages }}</span>
            </span>
        </a>
        <a href="{% url 'members:account_notifications' %}" class="account-nav-link{% if account_section == 'notifications' %} active{% endif %}">
            <span class="account-nav-label">Notifications</span>
            <span class="account-nav-hint">
                Updates
                <span class="account-nav-badge" data-account-count="notifications"{% if not unread_notifications %} hidden{% endif %}>{{ unread_notifications }}</span>
            </span>
        </a>
    </div>
    <div class="account-nav-group account-nav-group--last">
        <p class="account-nav-group-title">Account</p>
        <a href="{% url 'members:account_settings' %}" class="account-nav-link{% if account_section == 'settings' %} active{% endif %}">
            <span class="account-nav-label">Settings</span>
            <span class="account-nav-hint">Security</span>
        </a>
    </div>
    <div class="account-nav-divider"></div>
    <form method="post" action="{% url 'members:logout' %}" class="account-nav-form">
        {% csrf_token %}
        <button type="submit" class="account-nav-link account-nav-link--danger account-nav-button">
            <span class="account-nav-label">Sign Out</span>
            <span class="account-nav-hint">Leave your account</span>
        </button>
    </form>
</nav>
