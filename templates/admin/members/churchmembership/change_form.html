{% extends "admin/change_form.html" %}
{# Church membership add/change form: native selects instead of select2. #}
{% block extrajs %}
    {{ block.super }}
    <script>
    (function () {
        'use strict';
        // Jazzmin converts every <select> on admin forms into a select2
        // widget; on the member forms that is unnecessary and looks
        // unprofessional. Disable select2 before the page finishes
        // initialising and pull any already-rendered widgets back to
        // the native <select> elements.
        function neutraliseSelect2(root) {
            root = root || document;
            root.querySelectorAll('select').forEach(function (select) {
                var container = select.nextElementSibling;
                while (container && container.classList && container.classList.contains('select2-container')) {
                    container.remove();
                    container = select.nextElementSibling;
                }
                select.classList.remove('select2-hidden-accessible');
                select.removeAttribute('tabindex');
                select.removeAttribute('aria-hidden');
                select.style.display = 'block';
                select.style.width = '100%';
            });
        }

        // change_form.js calls $(select).select2(...) from the global jQuery
        // at DOM-ready; make it a no-op so the native selects stay put.
        if (window.jQuery && window.jQuery.fn) {
            window.jQuery.fn.select2 = function () { return this; };
        }
        if (window.django && window.django.jQuery && window.django.jQuery.fn) {
            window.django.jQuery.fn.select2 = function () { return this; };
        }
        if (window.django && window.django.jQuery) {
            window.django.jQuery(function () { neutraliseSelect2(document); });
            window.django.jQuery(document).on('formset:added', function (e) {
                neutraliseSelect2(e.target);
            });
        }
    })();
    </script>
{% endblock %}
